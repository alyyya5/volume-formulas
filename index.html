;border:1px solid var(--orange);border-radius:50%;font-weight:650;color:var(--orange);margin-top:3px}.important-note strong{font-size:18px;font-weight:550;color:var(--orange)}.important-note p{margin:9px 0 0;color:#d7d9d0;font-size:14px;line-height:1.8}.course-finish{display:flex;align-items:center;gap:22px;border:1px solid #79e2c360;border-radius:14px;background:#79e2c30b;padding:28px;margin-top:30px;animation:enter .5s ease}.course-finish h2{font-size:25px;margin:0 0 7px}.course-finish p{font-size:14px;color:var(--muted);margin:0;max-width:620px}.finish-check{width:46px;height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--accent);border-radius:50%;font-size:24px;color:var(--accent)}.questions{gap:18px}.question{padding:22px}.question h3{font-size:17px;margin-top:10px}.task-diagram{display:block;width:100%;height:185px;stroke:var(--accent);stroke-width:1.5;fill:#79e2c309;margin:10px 0 8px}.task-diagram text{stroke:none;fill:var(--text);font:12px system-ui}.task-diagram .dim-line{fill:none;stroke:var(--muted);stroke-dasharray:4 4}.task-diagram .radius{fill:none;stroke:var(--orange)}.answer{min-height:49px;line-height:1.5}.feedback{min-height:25px;line-height:1.75}.feedback .frac{font-size:.9em}.slice-reason{margin-top:18px;border-top:1px solid var(--line);padding-top:13px;font-size:13px;color:var(--muted)}.slice-reason summary{cursor:pointer;color:#bdd8d2;line-height:1.6}.reason-body svg{display:block;height:110px;width:100%;stroke:var(--accent);stroke-width:1.5;fill:none;margin-top:12px}.reason-body svg text{fill:var(--text);stroke:none;font:14px system-ui}.reason-body p{line-height:1.8;margin:10px 0 0}#panel-5 .section-note{display:block}footer{font-size:11px;padding-top:40px;padding-bottom:26px}

<body>
<header>
<h1>Формулы объёма</h1>
<p class="intro">Увидеть, понять, применить.</p>
<nav aria-label="Навигация по странице" id="nav"><a href="#choose">Выбрать фигуру</a><a href="#panel-5">Проверь себя</a><a href="#panel-6">Все формулы</a></nav>
<section id="choose" class="choose"><div class="choose-heading"><div><h2>С какой фигуры начнём?</h2></div><button type="button" class="btn primary" id="start-course">▶ Смотреть всё по порядку</button></div><div class="figure-picker"></div></section>
</header>
<main id="main"></main>
<footer>Геометрия · Формулы объёма</footer>
<script>
'use strict';
const $=s=>document.querySelector(s);
const colors={mint:'#79e2c3',blue:'#84baff',gold:'#f3bf7b',muted:'#a5b8b7',line:'#50676a'};
const lessons=[
  {
    "id": "prism",
    "name": "Призма",
    "title": "Один столбик. Затем — весь объём.",
    "legend": "Точки представляют маленькие участки основания",
    "symbol": "V = S · h",
    "units": "S — площадь основания; h — высота",
    "steps": [
      [
        "Одна точка основания",
        "Выделим точку на основании призмы. Представьте вокруг неё совсем маленький участок: из таких участков складывается вся площадь основания S."
      ],
      [
        "Поднимаем на высоту h",
        "Поднимем этот участок на высоту h. Получится тонкий столбик, который проходит через всю призму — от нижнего основания до верхнего."
      ],
      [
        "Ещё точка — ещё столбик",
        "Повторим то же самое для остальных точек основания. Все столбики одной высоты h. Они постепенно заполняют пространство внутри призмы."
      ],
      [
        "Занят весь объём",
        "Если поднять все точки основания на высоту h, они займут весь объём фигуры. Поэтому V = S · h"
      ]
    ]
  },
  {
    "id": "cylinder",
    "name": "Цилиндр",
    "title": "Круг в основании. Та же идея.",
    "legend": "Маленькие участки круга поднимаются на одну высоту",
    "symbol": "V = S · h",
    "units": "S — площадь основания (круга): S = πr²; h — высота",
    "steps": [
      [
        "Как у призмы, только основание — круг",
        "Способ тот же: поднимаем маленькие участки основания на одинаковую высоту. Но здесь основание — круг, и его площадь S = πr²."
      ],
      [
        "Первый столбик",
        "Поднимем выделенный участок круга на высоту h. Столбик проходит через весь цилиндр."
      ],
      [
        "Заполняем цилиндр",
        "У каждой точки основания появляется свой столбик высоты h. Вместе они занимают весь цилиндр."
      ],
      [
        "Площадь основания × высота",
        "Если поднять все точки основания на высоту h, они займут весь объём фигуры. Поэтому V = S · h"
      ]
    ]
  },
  {
    "id": "pyramid",
    "name": "Пирамида",
    "title": "Три пирамиды — одна призма.",
    "legend": "Модель: три равные квадратные пирамиды внутри куба",
    "symbol": "V = <span class=\"frac\" role=\"math\" aria-label=\"1 треть\"><span>1</span><span>3</span></span> S · h",
    "units": "S — площадь основания; h — высота",
    "steps": [
      [
        "Сначала рассмотрим пирамиду",
        "У пирамиды есть основание и вершина. S — площадь основания, h — высота: перпендикуляр от вершины к плоскости основания. Чтобы найти её объём, сравним пирамиду с призмой."
      ],
      [
        "Три пирамиды внутри призмы",
        "Возьмём куб — это тоже призма. Его можно разделить на три одинаковые квадратные пирамиды. У каждой площадь основания S и высота h такие же, как у куба. Объём призмы мы уже знаем: <strong>S · h</strong>."
      ],
      [
        "Одна пирамида — треть призмы",
        "Три одинаковые пирамиды вместе занимают весь куб. Значит, объём одной — треть объёма призмы: <strong>площадь основания умножаем на высоту и делим на три.</strong> Это правило верно для любой пирамиды."
      ]
    ]
  },
  {
    "id": "cone",
    "name": "Конус",
    "title": "Конус — пирамида с круглым основанием.",
    "legend": "Многоугольник приближается к кругу: коэффициент 1/3 сохраняется",
    "symbol": "V = <span class=\"frac\" role=\"math\" aria-label=\"1 треть\"><span>1</span><span>3</span></span> S · h",
    "units": "S — площадь основания (круга): S = πr²; h — высота",
    "steps": [

 for(const cx of [left,right]){const b=Array.from({length:n},(_,k)=>{const a=2*Math.PI*k/n+Math.PI/4+angle;return[cx+r*Math.cos(a),base+ry*Math.sin(a)]});const topPts=b.map(p=>[p[0],p[1]-hh]);poly(b,'#f3bf7b20',colors.gold);if(cx===left)poly(topPts,'#79e2c310',colors.mint);for(let k=0;k<n;k++){if(cx===right)poly([[cx,top],b[k],b[(k+1)%n]],'#84baff05',n>16?'#84baff24':colors.blue);else line([b[k],topPts[k]],n>16?'#79e2c322':colors.mint)}}
 }
 for(const cx of [left,right])label('S',cx,base+ry+24,colors.mint,15);
 label(stage===1||stage===2?'Призма':'Цилиндр',left,H*.91,colors.muted,14);label(stage===1||stage===2?'Пирамида':'Конус',right,H*.91,colors.muted,14);

function sphere(stage,t){
 const r=stage===0?Math.min(W*.24,H*.26):Math.min(W*.16,H*.22),left=stage===0?W*.5:W*.25,right=W*.73,cy=H*.43,ry=r*.24;
 function orb(cx){ellipse(cx,cy,r,r,'#79e2c31a',colors.mint);ellipse(cx,cy,r,ry,null,'#79e2c355');line([[cx,cy],[cx+r,cy]],colors.mint);label('R',cx+r*.5,cy-7,colors.mint,12)}
 vessel(left,cy+r,r,ry,2*r,0,colors.mint);orb(left);dim([left-r-7,cy+r],[left-r-7,cy-r],'h',-6);
 if(stage===0){label('h = 2R',left,H*.79,colors.muted,15);label('S — площадь основания цилиндра',W*.5,H*.91,colors.muted,W<400?12:15);return}
 vessel(right,cy+r,r,ry,2*r,0,colors.mint);
 const appear=stage===1?ease(clamp(t*1.6)):1;ctx.globalAlpha=appear;
 poly([[right-r,cy-r],[right,cy],[right-r,cy+r]],'#79e2c330',null);poly([[right+r,cy-r],[right,cy],[right+r,cy+r]],'#79e2c330',null);
 poly([[right-r,cy-r],[right+r,cy-r],[right,cy]],'#f3bf7b3d',colors.gold);poly([[right-r,cy+r],[right+r,cy+r],[right,cy]],'#f3bf7b3d',colors.gold);ellipse(right,cy-r,r,ry,null,colors.gold);ellipse(right,cy+r,r,ry,null,colors.gold);ctx.globalAlpha=1;
 if(stage===1){label('Шар',left,H*.79,colors.mint,14);label('Убираем золотое',right,H*.79,colors.gold,W<400?11:14);return}
 if(stage===2){const z=Math.sin(t*Math.PI*2)*.86,zr=z*r,rr=Math.sqrt(Math.max(0,r*r-zr*zr)),inner=Math.abs(zr),y=cy-zr;
 line([[left-r-8,y],[right+r+8,y]],'#84baff70',1,[4,4]);ellipse(left,y,rr,rr*.16,'#84baff65',colors.blue);ellipse(right,y,r,ry,'#84baff65',colors.blue);ellipse(right,y,inner,inner*.24,'#f3bf7b99',colors.gold);
 const small=r*.48,yy=H*.80;ellipse(left,yy,small*Math.sqrt(1-z*z),small*Math.sqrt(1-z*z),'#79e2c366',colors.mint);ellipse(right,yy,small,small,'#79e2c366',colors.mint);ellipse(right,yy,small*Math.abs(z),small*Math.abs(z),'#121c1f',colors.gold);label('=',W*.49,yy+6,colors.mint,24);label('Срезы сверху: одинаковая площадь',W*.5,H*.96,colors.muted,W<400?11:15)}
 if(stage===3){line([[right-r-7,cy],[right+r+7,cy]],colors.mint,1.5,[4,4]);for(const k of [-1,1]){const a=[right+r+13,cy],b=[right+r+13,cy+k*r];dim(a,b,'',0);canvasFraction('h',2,right+r+26,cy+k*r*.5,colors.muted,13)}label('Треть верхней половины',W*.5,H*.13,colors.gold,W<400?12:15);label('и треть нижней = треть всего',W*.5,H*.91,colors.gold,W<400?12:15)}

function sliceReason(){return `<details class="slice-reason"><summary>Почему площади круга и кольца равны?</summary><div class="reason-body"><svg viewBox="0 0 220 120" role="img" aria-label="Прямоугольный треугольник: катеты a и b, гипотенуза R"><path d="M35 100V25L175 100Z"/><path d="M35 88H47V100"/><text x="105" y="116">a</text><text x="16" y="65">b</text><text x="112" y="52">R</text></svg><p>a — радиус среза шара, b — радиус отверстия в кольце. В шаре они образуют прямоугольный треугольник с гипотенузой R.</p><p>По теореме Пифагора: a² + b² = R². Поэтому πa² = πR² − πb²: площадь малого круга равна площади большого круга без отверстия.</p></div></details>`}

function draw(i,stage,t=1){const c=$(`#panel-${i} canvas`),box=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);W=box.width;H=box.height;drawingFigure=i;if(!W)return;if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)}ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 if(i<2){const s=stage===0?0:stage===1?ease(clamp(t*1.5)):stage===2?1+ease(clamp(t*1.25)):2+ease(clamp(t*1.5));columns(s,i===1);if(stage===0){ctx.globalAlpha=.3+.4*Math.sin(t*Math.PI*4)**2;const seed=i===1?[W*.47-.36*Math.min(W*.31,H*.50)*.93,H*.77+.30*Math.min(W*.31,H*.50)*.31]:cubeProject(.41,.65,0);dot(...seed,8);ctx.globalAlpha=1}}else if(i===2)pyramid(stage,t);else if(i===3)cone(stage,t);else sphere(stage,t)}
let resizeFrame;new ResizeObserver(()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{if(active>=0)renderPlayer()})}).observe($('#main'));
// 75 заданий: по 15 на каждую фигуру. В тренировке — по два задания каждого вида.
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function frac(n,d){const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):`<span class="frac" role="math" aria-label="${n} делить на ${d}"><span>${n}</span><span>${d}</span></span>`}
function quantity(n,d=1,pi=false,unit='см³'){const g=gcd(n,d);n/=g;d/=g;return `${pi&&n===d?'':frac(n,d)}${pi?'π':''}${unit?' '+unit:''}`}
function shuffled(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const quizzes=[];
function addQuestion(kind,q,n,d,pi,labels,why,hint,unit='см³'){
 const value=n/d;const choices=[[n,d],[n*3,d],[n*2,d],[n,d*2],[n+d*3,d],[n+d,d]].filter(([a,b],i,arr)=>arr.findIndex(([c,e])=>Math.abs(a/b-c/e)<1e-9)===i).slice(0,4);
 if(choices.length<4)throw Error('Недостаточно различных ответов');
 const answer=quantity(n,d,pi,unit),a=shuffled(choices.map(([x,y])=>quantity(x,y,pi,unit)));
 quizzes.push({id:quizzes.length,kind,shape:lessons[kind].name,q,a,ok:a.indexOf(answer),value,answer,labels,why,hint});
}
const basicHints=['Умножьте площадь основания на высоту.','Площадь круглого основания равна πr². Умножьте её на высоту.','Умножьте площадь основания на высоту и разделите на три.','Найдите площадь круглого основания, умножьте на высоту и разделите на три.','Объём шара равен четырём третям πR³. Не забудьте возвести радиус в куб.'];
for(let k=0;k<5;k++){
 const S=[12,18,24,30,36][k],h=[4,5,6,7,8][k],a=k+2,b=k+3;
 addQuestion(0,`Площадь основания призмы — ${S} см², высота — ${h} см. Найдите объём.`,S*h,1,false,{S:`S = ${S} см²`,h:`h = ${h} см`},`V = S · h = ${S} · ${h} = ${S*h} см³.`,basicHints[0]);
 addQuestion(0,`У прямоугольной призмы длина ${a} см, ширина ${b} см и высота ${h} см. Найдите объём.`,a*b*h,1,false,{a:`a = ${a} см`,b:`b = ${b} см`,h:`h = ${h} см`},`Площадь основания S = ${a} · ${b} = ${a*b} см². V = ${a*b} · ${h} = ${a*b*h} см³.`, 'Сначала найдите площадь прямоугольного основания: длина × ширина.');
 addQuestion(0,`Объём призмы — ${S*h} см³, площадь основания — ${S} см². Найдите высоту.`,h,1,false,{S:`S = ${S} см²`,h:'h = ?',V:`V = ${S*h} см³`},`h = V : S = ${S*h} : ${S} = ${h} см.`, 'Чтобы найти высоту призмы, разделите объём на площадь основания.','см');
 const r=k+2,ch=k+3,dia=2*r;
 addQuestion(1,`Радиус цилиндра — ${r} см, высота — ${ch} см. Найдите объём.`,r*r*ch,1,true,{r:`r = ${r} см`,h:`h = ${ch} см`},`S = π · ${r}² = ${r*r}π см². V = S · h = ${r*r*ch}π см³.`,basicHints[1]);
 addQuestion(1,`Диаметр основания цилиндра — ${dia} см, высота — ${ch+1} см. Найдите объём.`,r*r*(ch+1),1,true,{r:`d = ${dia} см`,diameter:true,h:`h = ${ch+1} см`},`Радиус равен половине диаметра: r = ${r} см. S = ${r*r}π см². V = ${r*r*(ch+1)}π см³.`, 'Сначала разделите диаметр на два — в формуле площади круга используется радиус.');
 addQuestion(1,`Площадь основания цилиндра — ${r*r}π см², объём — ${r*r*ch}π см³. Найдите высоту.`,ch,1,false,{S:`S = ${r*r}π см²`,h:'h = ?'},`h = V : S = ${r*r*ch}π : ${r*r}π = ${ch} см.`, 'Разделите объём на площадь основания. Множитель π сократится.','см');
 const ph=3*(k+2),sq=k+3;
 addQuestion(2,`Площадь основания пирамиды — ${S} см², высота — ${ph} см. Найдите объём.`,S*ph,3,false,{S:`S = ${S} см²`,h:`h = ${ph} см`},`V = ${frac(1,3)} · ${S} · ${ph} = ${S*ph/3} см³.`,basicHints[2]);
 addQuestion(2,`Основание пирамиды — квадрат со стороной ${sq} см. Высота — ${ph} см. Найдите объём.`,sq*sq*ph,3,false,{a:`a = ${sq} см`,h:`h = ${ph} см`},`S = ${sq}² = ${sq*sq} см². V = ${frac(1,3)} · ${sq*sq} · ${ph} = ${sq*sq*ph/3} см³.`, 'Найдите площадь квадрата, затем используйте формулу объёма пирамиды.');
 addQuestion(2,`Объём пирамиды — ${S*ph/3} см³, площадь основания — ${S} см². Найдите высоту.`,ph,1,false,{S:`S = ${S} см²`,h:'h = ?'},`h = 3V : S = 3 · ${S*ph/3} : ${S} = ${ph} см.`, 'Для пирамиды высота равна утроенному объёму, делённому на площадь основания.','см');
 addQuestion(3,`Радиус конуса — ${r} см, высота — ${ph} см. Найдите объём.`,r*r*ph,3,true,{r:`r = ${r} см`,h:`h = ${ph} см`},`S = ${r*r}π см². V = ${frac(1,3)} S · h = ${r*r*ph/3}π см³.`,basicHints[3]);
 addQuestion(3,`Диаметр основания конуса — ${dia} см, высота — ${ph+3} см. Найдите объём.`,r*r*(ph+3),3,true,{r:`d = ${dia} см`,diameter:true,h:`h = ${ph+3} см`},`r = ${dia} : 2 = ${r} см. V = ${frac(1,3)} · ${r*r}π · ${ph+3} = ${r*r*(ph+3)/3}π см³.`, 'Разделите диаметр на два. Затем найдите площадь основания и треть произведения площади на высоту.');
 addQuestion(3,`Объём конуса — ${r*r*ph/3}π см³, площадь основания — ${r*r}π см². Найдите высоту.`,ph,1,false,{S:`S = ${r*r}π см²`,h:'h = ?'},`h = 3V : S = 3 · ${r*r*ph/3}π : ${r*r}π = ${ph} см.`, 'Используйте h = 3V : S.','см');
 addQuestion(4,`Радиус шара — ${r} см. Найдите объём.`,4*r**3,3,true,{r:`R = ${r} см`},`V = ${frac(4,3)} · π · ${r}³ = ${quantity(4*r**3,3,true)}.`,basicHints[4]);
 addQuestion(4,`Диаметр шара — ${dia+2} см. Найдите объём.`,4*(r+1)**3,3,true,{r:`d = ${dia+2} см`,diameter:true},`R = ${r+1} см. V = ${frac(4,3)} · π · ${r+1}³ = ${quantity(4*(r+1)**3,3,true)}.`, 'Радиус — половина диаметра. Именно радиус нужно возвести в куб.');
 addQuestion(4,`Объём шара — ${quantity(4*r**3,3,true)}. Найдите радиус.`,r,1,false,{r:'R = ?'},`Из V = ${frac(4,3)}πR³ получаем R³ = ${r**3}. Значит, R = ${r} см.`, 'Разделите объём на четыре третьих π, затем найдите число, куб которого получился.','см');
}
const usedQuestionIds=new Set();let round=[],previousIds=new Set(),solved=new Set();
function renderQuiz(){
 const next=[];
 for(let kind=0;kind<5;kind++)for(let j=0;j<2;j++){
  let options=quizzes.filter(q=>q.kind===kind&&!usedQuestionIds.has(q.id)&&!previousIds.has(q.id)&&!next.includes(q));
  if(!options.length){quizzes.filter(q=>q.kind===kind).forEach(q=>usedQuestionIds.delete(q.id));options=quizzes.filter(q=>q.kind===kind&&!previousIds.has(q.id)&&!next.includes(q))}
  const q=options[Math.floor(Math.random()*options.length)];next.push(q);usedQuestionIds.add(q.id);
 }
 round=shuffled(next);previousIds=new Set(round.map(q=>q.id));solved.clear();$('#score').textContent='Решено: 0 из 10';
 $('.questions').innerHTML=round.map((q,i)=>`<article class="question" aria-labelledby="q-${i}"><div class="q-num">${String(i+1).padStart(2,'0')} · ${q.shape}</div>${taskDiagram(q,i)}<h3 id="q-${i}">${q.q}</h3><div class="answers" role="group" aria-labelledby="q-${i}">${q.a.map((a,j)=>`<button type="button" class="answer" data-q="${i}" data-a="${j}">${a}</button>`).join('')}</div><div class="feedback" role="status" aria-live="polite"></div></article>`).join('');
}
function taskDiagram(q,i){
 const L=q.labels,txt=(x,y,t,anchor='middle')=>t?`<text x="${x}" y="${y}" text-anchor="${anchor}">${t}</text>`:'';let art='';
 if(q.kind===0){art='<path d="M68 62 143 39 205 62 130 85Z M68 62V127L130 151 205 127V62 M130 85V151"/><path class="dim-line" d="M223 62V127"/>'+txt(230,100,L.h,'start')+txt(126,124,L.S)+txt(104,162,L.a)+txt(182,151,L.b)}
 if(q.kind===1){art='<ellipse cx="126" cy="49" rx="52" ry="16"/><path d="M74 49V132C74 154 178 154 178 132V49"/><ellipse cx="126" cy="132" rx="52" ry="16"/><path class="dim-line" d="M200 49V132"/>'+txt(208,94,L.h,'start')+(L.r?`<path class="radius" d="M${L.diameter?74:126} 49H178"/>`+txt(126,23,L.r):txt(126,110,L.S))}
 if(q.kind===2){art='<path d="M124 23 57 126 124 152 192 126Z M124 23V152 M57 126 124 104 192 126"/><path class="dim-line" d="M210 23V126"/>'+txt(216,76,L.h,'start')+txt(122,140,L.S)+txt(69,163,L.a)}
 if(q.kind===3){art='<path d="M72 134 124 24 176 134"/><ellipse cx="124" cy="134" rx="52" ry="16"/><path class="dim-line" d="M124 24V134"/>'+txt(140,78,L.h,'start')+(L.r?`<path class="radius" d="M${L.diameter?72:124} 134H176"/>`+txt(124,169,L.r):txt(123,171,L.S))}
 if(q.kind===4){art='<circle cx="125" cy="91" r="58"/><ellipse cx="125" cy="91" rx="58" ry="17"/><path class="radius" d="M'+(L.diameter?67:125)+' 91H183"/>'+txt(132,77,L.r)}
 return `<svg class="task-diagram" viewBox="0 0 300 185" role="img" aria-labelledby="drawing-${i}"><title id="drawing-${i}">${q.shape}. ${Object.values(L).filter(v=>typeof v==='string').join('. ')}</title>${art}</svg>`;
}
$('.questions').addEventListener('click',e=>{const b=e.target.closest('.answer');if(!b)return;const i=+b.dataset.q,a=+b.dataset.a,q=round[i],card=b.closest('.question'),f=card.querySelector('.feedback');if(solved.has(i))return;card.querySelectorAll('.answer').forEach(x=>x.classList.remove('wrong'));if(a===q.ok){solved.add(i);b.classList.add('correct');card.querySelectorAll('.answer').forEach(x=>x.disabled=true);f.className='feedback good';f.innerHTML='✓ Верно! '+q.why;$('#score').textContent=solved.size===round.length?'Все задачи решены — можно начать новую тренировку':`Решено: ${solved.size} из ${round.length}`}else{b.classList.add('wrong');f.className='feedback bad';f.textContent='Пока неверно. '+q.hint}});
